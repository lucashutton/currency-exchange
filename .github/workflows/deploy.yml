name: Build, test and deploy

on:
  push:
    branches: [master]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish API
        run: dotnet publish src/CurrencyExchange.Api --configuration Release --output publish/api

      - name: Publish Web
        run: dotnet publish src/CurrencyExchange.Web --configuration Release --output publish/web

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: currency-exchange-api-lucas
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish/api

      - name: Deploy Web to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/web/wwwroot
          skip_app_build: true